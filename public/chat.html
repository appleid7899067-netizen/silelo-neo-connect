<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slieloboss22</title>
    <!-- Geist Font -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050505;
            color: #fff;
            font-family: 'Geist', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 1. โลโก้เล็กๆ มุมซ้ายบน */
        .brand-logo {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 32px;
            height: 32px;
            background: #00e0a4;
            border-radius: 8px;
            display: grid;
            place-items: center;
            font-weight: bold;
            color: #000;
        }

        /* 2. ชื่อกลางจอ (คมและเบา) */
        .main-title {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: -0.05em;
            opacity: 0.9;
        }

        /* 3. กล่องแชทด้านล่าง (Glassmorphism) */
        .input-container {
            padding: 20px;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .input-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .input-box input {
            flex: 1;
            background: none;
            border: none;
            color: #fff;
            padding: 4px;
            outline: none;
            font-size: 0.95rem;
        }

        .send-btn {
            background: #fff;
            color: #000;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .send-btn:hover { transform: scale(1.1); }
    </style>
</head>
<body>

    <div class="brand-logo">S</div>

    <div class="main-title">slieloboss22</div>

    <div class="input-container">
        <div class="input-box">
            <input type="text" placeholder="ส่งข้อความ...">
            <button class="send-btn">↑</button>
        </div>
    </div>

</body>
</html>
